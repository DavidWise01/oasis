name: UEP-297R qualified execution attribution
on:
  push:
    paths:
      - '.github/workflows/uep-generations-297.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2096ac1682eabf5b20c04cedce48a1dc2d687d24
          persist-credentials: false
      - name: Recover native-qualified dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uep297"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15077861777/zip" > "$RUNNER_TEMP/native.zip"
          echo "b0b1a676ef7ee44e33c4907dc08a926227edc4851f4495c2a406686475f0313e  $RUNNER_TEMP/native.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/native.zip" Cargo.lock > apps/uep/rust/Cargo.lock
          echo "af9e971445417daa5d9996aac6e35dafc51b8f93313076f7a70af2c59e5109f5  apps/uep/rust/Cargo.lock" | sha256sum -c -
          git rev-parse HEAD | tee "$RUNNER_TEMP/uep297/source.txt"
      - name: Execute inherited and new native regressions
        working-directory: apps/uep/rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 fetch --locked
          cargo +1.85.1 test --frozen 2>&1 | tee "$RUNNER_TEMP/uep297/tests.txt"
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'uep297'
          s=(p/'tests.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out',s)
          assert [sum(int(r[i]) for r in rows) for i in range(5)]==[291,0,0,0,0], rows
          assert len(re.findall(r'^test qualified_recovery::unified296_tests::.* \.\.\. ok$',s,re.M))==5
          PY
      - name: Execute three successive recovery generations
        working-directory: apps/uep/rust
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/uep297"
          (cd ../UEP-259R-integrated-generations && sha256sum -c SHA256SUMS)
          cargo +1.85.1 run --frozen --release --bin generations297 -- "$out" | tee "$out/generations297.json"
          python3 - <<'PY'
          import csv,json,os,pathlib,hashlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'uep297'
          a=list(csv.DictReader((p/'generations297.csv').open()))
          assert len(a)==3
          assert len((p/'anchors297.bin').read_bytes())==624
          for i,r in enumerate(a,1):
              b=(p/f'generation-{i}.bin').read_bytes()
              assert int(r['generation'])==i and int(r['start'])==1080+360*(i-1) and int(r['end'])==1080+360*i
              assert len(b)==int(r['bytes']) and hashlib.sha256(b).hexdigest()==r['sha256']
          s=json.loads((p/'generations297.json').read_text())
          assert s==dict(generations=3,newPeriods=1080,terminal=2160,recoveries=6,exactParity=True,actualPayments=0)
          PY
          (cd "$out" && sha256sum generations297.csv generations297.json anchors297.bin generation-*.bin generation-*.state > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uep-297r-native-evidence
          path: ${{ runner.temp }}/uep297/
      - name: Report qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="UEP-297R/native" -f description="Qualified execution attribution" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
