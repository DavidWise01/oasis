name: AETHER-281 Crash and Recovery Forensic Regressions
on:
  push:
    paths:
      - 'aether/280/**'
      - 'aether/281/**'
      - '.github/workflows/aether281-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subprocess-crash-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/281 -p 'test_*.py' -v
      - run: echo 'Process-exit tests do not qualify power-cut durability or external custody.'
