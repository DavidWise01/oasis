name: AETHER-251 Namespace Challenge Unit Tests
on:
  push:
    paths:
      - 'aether/251/**'
      - '.github/workflows/aether251-namespace-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-crypto-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/251 -p 'test_*.py' -v
      - run: echo 'Local Ed25519 fixtures do not authenticate external custody or namespace isolation.'
