name: AETHER-241 Cross-Controller Receipt Tests
on:
  push:
    paths:
      - 'aether/241/**'
      - '.github/workflows/aether241-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-receipt-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise adversarial receipt logic (mock signatures)
        run: python3 -m unittest discover -s aether/241 -p 'test_*.py' -v
      - name: Keep authority explicitly gated
        run: echo 'Mock signatures are not independent controller custody or authenticated UTC.'
