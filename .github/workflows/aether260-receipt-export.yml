name: AETHER-260 Receipt Export Replay Regression
on:
  push:
    paths:
      - 'aether/258/**'
      - 'aether/260/**'
      - '.github/workflows/aether260-receipt-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s aether/260 -p 'test_*.py' -v
      - run: echo 'Local SQLite export integrity is not independently witnessed external custody.'
