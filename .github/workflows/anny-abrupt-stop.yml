name: ANNY Abrupt-Stop Boundary

on:
  push:
    branches: [main]
    paths:
      - 'apps/anny-neon/**'
      - '.github/workflows/anny-abrupt-stop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abrupt-stop:
    name: Five-stage SIGKILL + independent receiver recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GitHub Pages source
        uses: actions/checkout@v4
      - name: Node.js test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute crash classifier and existing registry tests
        run: |
          node --test \
            apps/anny-neon/crash-lab.test.mjs \
            apps/anny-neon/sapphon-spectrum.test.mjs \
            apps/anny-neon/radiation-overlay.test.mjs \
            apps/anny-neon/sapphon-geometry.test.mjs
      - name: Python test runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Compile Python abrupt-kill driver
        run: python -m py_compile apps/anny-neon/tests/abrupt_kill_gate.py
      - name: Five abrupt browser process interruptions
        env:
          ANNY_BROWSER_ARTIFACTS: ${{ runner.temp }}/anny-abrupt-evidence
        run: python apps/anny-neon/tests/abrupt_kill_gate.py
      - name: Upload interruption evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anny-abrupt-kill-evidence
          path: ${{ runner.temp }}/anny-abrupt-evidence/
          if-no-files-found: warn
          retention-days: 30
