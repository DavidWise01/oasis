name: UEP-279R indexed evidence publication
on:
  push:
    paths:
      - '.github/workflows/uep-evidence-279.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  statuses: write
concurrency:
  group: uep-evidence-279
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and stage actual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p=apps/uep/UEP-279R-integrated-authenticated
          mkdir -p "$RUNNER_TEMP/uep279" "$RUNNER_TEMP/extract279"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15230380929/zip" > "$RUNNER_TEMP/evidence279.zip"
          echo "fe253c131312af9a7c2dab9b36eda6f3bebcd348bb71b0ce5788e6756e63ed2d  $RUNNER_TEMP/evidence279.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/evidence279.zip" -d "$RUNNER_TEMP/extract279"
          e="$RUNNER_TEMP/extract279"
          (cd "$e" && sha256sum -c SHA256SUMS)
          git diff --exit-code a38799db77cdcdd93215219db4a4fb26b6b8be4c HEAD -- "$p/index.html"
          for f in opening.commitment performance278.csv recovery278.csv performance278.json summary278.json balanced-indexed.bin balanced-authenticated.bin balanced-anchors.bin balanced-terminal.state scarcity-indexed.bin scarcity-authenticated.bin scarcity-anchors.bin scarcity-terminal.state churn-indexed.bin churn-authenticated.bin churn-anchors.bin churn-terminal.state SHA256SUMS manifest.sha256; do test ! -e "$p/$f"; done
          for f in opening.commitment performance278.csv recovery278.csv performance278.json summary278.json balanced-indexed.bin balanced-authenticated.bin balanced-anchors.bin balanced-terminal.state scarcity-indexed.bin scarcity-authenticated.bin scarcity-anchors.bin scarcity-terminal.state churn-indexed.bin churn-authenticated.bin churn-anchors.bin churn-terminal.state SHA256SUMS; do cp "$e/$f" "$p/"; done
          (cd "$p" && sha256sum -c SHA256SUMS && sha256sum SHA256SUMS | cut -d' ' -f1 > manifest.sha256)
          cp "$p/SHA256SUMS" "$p/manifest.sha256" "$RUNNER_TEMP/uep279/"
      - name: Browser acceptance
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/uep279-node" --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/uep279-node/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --directory apps/uep/UEP-279R-integrated-authenticated > /tmp/uep279-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do if curl --fail --silent http://localhost:8765/ > /dev/null; then break; fi; sleep 1; done
          curl --fail --silent http://localhost:8765/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/uep279-node/node_modules" node <<'JS' | tee "$RUNNER_TEMP/uep279/browser.txt"
          const {chromium}=require('playwright');const assert=require('node:assert/strict');
          (async()=>{const b=await chromium.launch();try{const p=await b.newPage();const errors=[];p.on('pageerror',e=>errors.push(e.message));await p.goto('http://localhost:8765');for(const [response,msg] of [[{status:404},'HOLD · performance278.csv HTTP 404'],[{status:200,body:'corrupt'},'HOLD · digest performance278.csv']]){await p.route('**/performance278.csv',r=>r.fulfill(response));await p.click('#load');await p.waitForFunction(msg=>document.querySelector('#status').textContent===msg,msg);assert.equal(await p.locator('#gate').evaluate(e=>e.disabled),true);assert(await p.locator('#n').isDisabled());assert.equal(await p.locator('#o').textContent(),'');await p.unroute('**/performance278.csv');}await p.click('#load');await p.waitForFunction(()=>document.querySelector('#status').textContent.startsWith('PASS'));assert(await p.locator('#n').isEnabled());let count=0;for(const scenario of ['balanced','scarcity','churn']){await p.selectOption('#s',scenario);for(const t of [1081,1200,1440]){await p.locator('#n').evaluate((e,t)=>{e.value=t;e.dispatchEvent(new Event('input'))},t);assert((await p.locator('#o').textContent()).startsWith('Period '+t+' |'));assert(/^[a-f0-9]{64}$/.test(await p.locator('#root').textContent()));assert((await p.locator('#o').textContent()).includes('Audit calls 1 / 3 / 1'));count++;}assert((await p.locator('#o').textContent()).includes('Arrears '+(scenario==='scarcity'?36400:400)));}assert.equal(errors.length,0);console.log(JSON.stringify({rows:1080,tapes:6,scenarioChecks:count,missingRejected:true,corruptRejected:true,pageErrors:0}));}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});

          JS
      - name: Publish immutable evidence
        run: |
          set -euo pipefail
          p=apps/uep/UEP-279R-integrated-authenticated
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f "$p/"{opening.commitment,performance278.csv,recovery278.csv,performance278.json,summary278.json,balanced-indexed.bin,balanced-authenticated.bin,balanced-anchors.bin,balanced-terminal.state,scarcity-indexed.bin,scarcity-authenticated.bin,scarcity-anchors.bin,scarcity-terminal.state,churn-indexed.bin,churn-authenticated.bin,churn-anchors.bin,churn-terminal.state,SHA256SUMS,manifest.sha256}
          git commit -m "UEP-279R: publish actual qualified generational evidence"
          published=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            git diff --exit-code a38799db77cdcdd93215219db4a4fb26b6b8be4c HEAD -- "$p/index.html"
            cmp "$p/SHA256SUMS" "$RUNNER_TEMP/uep279/SHA256SUMS"
            cmp "$p/manifest.sha256" "$RUNNER_TEMP/uep279/manifest.sha256"
            (cd "$p" && sha256sum -c SHA256SUMS)
            if git push origin HEAD:main; then published=1; break; fi
          done
          test "$published" = 1
          git rev-parse HEAD | tee "$RUNNER_TEMP/uep279/published.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uep-279r-publication-evidence
          path: ${{ runner.temp }}/uep279/
      - name: Report qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="UEP-279R/publication" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
