name: AETHER-245 Offline Cryptographic Qualification
on:
  push:
    paths:
      - 'aether/245/**'
      - '.github/workflows/aether245-crypto.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-signature-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/245 -p 'test_*.py' -v
      - run: echo 'Signed local fixtures do not prove external custody, network isolation, trusted UTC or physical authority.'
