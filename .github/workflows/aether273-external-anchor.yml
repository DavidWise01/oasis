name: AETHER-273 Registry Anchor and Raw Transcript Regressions
on:
  push:
    paths:
      - 'aether/273/**'
      - '.github/workflows/aether273-external-anchor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/273 -p 'test_*.py' -v
      - run: echo 'Claimed out-of-band anchor and raw readback fixtures do not verify external custody.'
