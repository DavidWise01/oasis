name: AETHER-279 Cross Database Reconciliation
on:
  push:
    paths:
      - 'aether/278/**'
      - 'aether/279/**'
      - '.github/workflows/aether279-crossdb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-sqlite-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s aether/279 -p 'test_*.py' -v
      - run: echo 'Read-only ATTACH consistency is not an atomic cross-DB commit guarantee.'
