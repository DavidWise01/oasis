name: AETHER-274 Acquisition Provenance Regressions
on:
  push:
    paths:
      - 'aether/274/**'
      - '.github/workflows/aether274-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-cryptographic-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/274 -p 'test_*.py' -v
      - run: echo 'Caller-supplied signed observations do not prove independent live acquisition.'
