name: ANNY Chromium Boundary

on:
  push:
    branches: [main]
    paths:
      - 'apps/anny-neon/**'
      - '.github/workflows/anny-chromium-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-gate:
    name: Chromium geometry + persistent recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published Pages sources
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Node.js for pure registry checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run pure registry regression tests
        run: node --test apps/anny-neon/sapphon-spectrum.test.mjs apps/anny-neon/radiation-overlay.test.mjs apps/anny-neon/sapphon-geometry.test.mjs
      - name: Install Playwright and headless Chromium
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Execute browser restart boundary
        env:
          ANNY_BROWSER_ARTIFACTS: ${{ runner.temp }}/anny-browser-evidence
        run: python apps/anny-neon/tests/browser_gate.py
      - name: Preserve audit JSON and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anny-chromium-browser-evidence
          path: ${{ runner.temp }}/anny-browser-evidence/
          if-no-files-found: warn
          retention-days: 30
