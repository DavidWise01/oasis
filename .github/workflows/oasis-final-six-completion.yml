name: OASIS Six Gates Completion v2
on:
  push:
    paths:
      - 'architecture/diatom-diamond/final-six/secure-relay*'
      - '.github/workflows/oasis-final-six-completion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin immutable OASIS dual floor and confirm identity/protocol
        working-directory: architecture/diatom-diamond
        run: |
          echo '47d4c89ac8155b9470852e0e23d2c059ad087eedc2b7949632a9431b5792fd4b  frozen/dual5-floor-v0.7/dual5.mjs' | sha256sum --check
          node iso-graded-chain-v1.9c.test.mjs
          node astrophage-compact-v2.1.test.mjs
      - name: Rebuild balanced portable WASM from frozen v2.4 Rust kernel
        working-directory: architecture/diatom-diamond/obf2-rust-dualtarget-v2.5
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          rustc --edition=2021 --target wasm32-unknown-unknown --crate-type cdylib \
            -C opt-level=3 -C lto=fat -C codegen-units=1 -C panic=abort -C strip=symbols \
            -C link-arg=--export-memory -C link-arg=--max-memory=8388608 \
            ../obf2-rust-dualtarget-v2.4/kernel.rs -o leanfast.wasm
          wc -c leanfast.wasm
      - name: Final security, durability and concurrency integration test
        working-directory: architecture/diatom-diamond
        run: node final-six/secure-relay.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oasis-six-gates-secure-completion
          path: architecture/diatom-diamond/final-six/secure-relay-results.json
