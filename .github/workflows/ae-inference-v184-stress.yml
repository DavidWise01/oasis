name: OaSIs v184 Stress Benchmark

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/ae-inference-v184-stress/**"
      - ".github/workflows/ae-inference-v184-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scale-to-failure suite
        working-directory: benchmarks/ae-inference-v184-stress
        run: python stress.py | tee stress-stdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: ae-inference-v184-stress
          path: benchmarks/ae-inference-v184-stress/stress-result.json
