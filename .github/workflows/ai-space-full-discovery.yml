name: Full OaSIs GitHub discovery
# Trigger requested full discovery run
on:
  workflow_dispatch:
  push:
    paths:
      - 'worlds/ai-space/discover_github.py'
      - '.github/workflows/ai-space-full-discovery.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Crawl all public owner repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 worlds/ai-space/discover_github.py
      - name: Publish complete discovery index
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worlds/ai-space/github-discovery-full.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "Refresh complete OaSIs GitHub discovery catalog"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: oasis-complete-github-discovery
          path: worlds/ai-space/github-discovery-full.json
