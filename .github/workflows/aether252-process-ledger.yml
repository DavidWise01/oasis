name: AETHER-252 Process and Ledger Unit Tests
on:
  push:
    paths:
      - 'aether/252/**'
      - '.github/workflows/aether252-process-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-process-crypto-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/252 -p 'test_*.py' -v
      - run: echo 'Offline signatures and proc stat fixtures are not live external custody or physical ACT.'
