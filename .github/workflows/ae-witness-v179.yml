name: AE Witness-Generative v179

on:
  push:
    branches: [main]
    paths:
      - "kernel/generative/ae-hierarchical-v178/**"
      - "kernel/generative/ae-witness-v179/**"
      - "kernel/frozen/ae-generative-first-v92/CANON.json"
      - ".github/workflows/ae-witness-v179.yml"
  pull_request:
    paths:
      - "kernel/generative/ae-hierarchical-v178/**"
      - "kernel/generative/ae-witness-v179/**"
      - "kernel/frozen/ae-generative-first-v92/CANON.json"
      - ".github/workflows/ae-witness-v179.yml"

permissions:
  contents: read

jobs:
  witness-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify v92 trust anchor, v178 parent, and v179 witness chain
        working-directory: kernel/generative/ae-witness-v179
        run: |
          python kernel.py --verify-canon --demo --emit-dir /tmp/ae-v179-receipts > /tmp/ae-v179-demo.json
          python test_kernel.py
          test "$(find /tmp/ae-v179-receipts -type f -name '*.json' | wc -l)" -eq 5
