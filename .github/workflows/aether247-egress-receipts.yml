name: AETHER-247 Signed Egress Observation Tests
on:
  push:
    paths:
      - 'aether/247/**'
      - '.github/workflows/aether247-egress-receipts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-signed-observation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/247 -p 'test_*.py' -v
      - run: echo 'Ed25519 test signatures are real. External network isolation and custody remain unverified.'
