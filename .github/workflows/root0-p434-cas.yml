name: ROOT0 P4.34 CAS Crash Regression
on:
  push:
    paths:
      - 'docs/reality-tensor/dyson-inversions/p434_*.mjs'
      - '.github/workflows/root0-p434-cas.yml'
  pull_request:
    paths:
      - 'docs/reality-tensor/dyson-inversions/p434_*.mjs'
      - '.github/workflows/root0-p434-cas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cas-crash-regression:
    name: Node.js 22 signed CAS SIGKILL regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run four crash boundaries
        working-directory: docs/reality-tensor/dyson-inversions
        run: node test_p434.mjs
