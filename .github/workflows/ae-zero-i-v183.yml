name: OaSIs Zero-I v183 Lean Proof

on:
  push:
    branches: [main]
    paths:
      - "kernel/generative/ae-zero-i-v183/**"
      - ".github/workflows/ae-zero-i-v183.yml"
  pull_request:
    paths:
      - "kernel/generative/ae-zero-i-v183/**"
      - ".github/workflows/ae-zero-i-v183.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test executable transform
        working-directory: kernel/generative/ae-zero-i-v183
        run: |
          python kernel.py > /tmp/v183.json
          python test_kernel.py
          grep -q "ZERO-I TRANSFORM PASS" /tmp/v183.json
      - name: Install Lean 4.33.1
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile Lean proof
        run: |
          lean --version
          lean kernel/generative/ae-zero-i-v183/proof/OaSIs_Zero_I_v183.lean
