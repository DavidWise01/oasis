name: OaSIs Lean integration checkpoint
on:
  push:
    paths:
      - 'lean/OasisKernelIntegrationV35.lean'
      - '.github/workflows/lean-kernel-integration.yml'
  pull_request:
    paths:
      - 'lean/OasisKernelIntegrationV35.lean'
      - '.github/workflows/lean-kernel-integration.yml'
  workflow_dispatch:

jobs:
  lean-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile integration boundary
        run: lean lean/OasisKernelIntegrationV35.lean
