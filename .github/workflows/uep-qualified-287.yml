name: UEP-287R unified qualified delta execution
on:
  push:
    paths:
      - '.github/workflows/uep-qualified-287.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4975230d7f15c10cb3d3aa61f114da40cc17e885
          persist-credentials: false
      - name: Recover native-qualified dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uep287"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15077861777/zip" > "$RUNNER_TEMP/native.zip"
          echo "b0b1a676ef7ee44e33c4907dc08a926227edc4851f4495c2a406686475f0313e  $RUNNER_TEMP/native.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/native.zip" Cargo.lock > apps/uep/rust/Cargo.lock
          echo "af9e971445417daa5d9996aac6e35dafc51b8f93313076f7a70af2c59e5109f5  apps/uep/rust/Cargo.lock" | sha256sum -c -
          git rev-parse HEAD | tee "$RUNNER_TEMP/uep287/source.txt"
      - name: Execute inherited and new native regressions
        working-directory: apps/uep/rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 fetch --locked
          cargo +1.85.1 test --frozen 2>&1 | tee "$RUNNER_TEMP/uep287/tests.txt"
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'uep287'
          s=(p/'tests.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out',s)
          assert [sum(int(r[i]) for r in rows) for i in range(5)]==[269,0,0,0,0], rows
          assert len(re.findall(r'^test qualified_delta::tests::.* \.\.\. ok$',s,re.M))==5
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uep-287r-native-evidence
          path: ${{ runner.temp }}/uep287/
      - name: Report qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="UEP-287R/native" -f description="Unified qualified delta execution" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
