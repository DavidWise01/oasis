name: AETHER-264 HTTPS Acquisition Security Regressions
on:
  push:
    paths:
      - 'aether/264/**'
      - '.github/workflows/aether264-acquisition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s aether/264 -p 'test_*.py' -v
      - run: echo 'Tests mock network transport; no live external custody has been observed.'
