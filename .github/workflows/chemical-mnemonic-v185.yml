name: OaSIs Chemical Mnemonic v185 Lean Proof\n\non:\n  push:\n    branches: [main]\n    paths:\n      - "kernel/generative/chemical-mnemonic-v185/**"\n      - ".github/workflows/chemical-mnemonic-v185.yml"\n  pull_request:\n    paths:\n      - "kernel/generative/chemical-mnemonic-v185/**"\n      - ".github/workflows/chemical-mnemonic-v185.yml"\n\npermissions:\n  contents: read\n\njobs:\n  prove:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Run executable benchmark\n        working-directory: kernel/generative/chemical-mnemonic-v185\n        run: python kernel.py\n      - name: Install Lean 4.33.1\n        run: |\n          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1\n          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"\n      - name: Compile Lean proof\n        run: |\n          lean --version\n          lean kernel/generative/chemical-mnemonic-v185/proof/OaSIs_Chemical_Mnemonic_v185.lean\n