name: AETHER-285 Acquisition Chain and Nonce Highwater
on:
  push:
    paths:
      - 'aether/285/**'
      - '.github/workflows/aether285-acquisition-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-forensic-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s aether/285 -p 'test_*.py' -v
      - run: echo 'Supplied manifests and self-issued anchors do not establish independent external custody.'
