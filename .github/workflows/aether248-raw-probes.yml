name: AETHER-248 Raw Probe Transcript Regression
on:
  push:
    paths:
      - 'aether/248/**'
      - '.github/workflows/aether248-raw-probes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s aether/248 -p 'test_*.py' -v
      - run: echo 'Offline consistency is not external isolation or physical qualification.'
