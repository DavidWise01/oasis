name: MN PRIME Recovery Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: python -m pip install cryptography
      - name: Capture provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p z341-evidence
          git rev-parse HEAD | tee z341-evidence/commit-sha.txt
          python --version | tee z341-evidence/python-version.txt
          python -m pip show cryptography | tee z341-evidence/dependency.txt
          for n in 328 329 330 331 332 333; do
            sha256sum "research/mn-prime/experimental-cipher/z${n}/test_z${n}.py"
          done | tee z341-evidence/source-sha256.txt
      - name: Run 115 checks
        shell: bash
        run: |
          set -euo pipefail
          python research/mn-prime/experimental-cipher/z337/run_recovery_suite.py 2>&1 | tee z341-evidence/regression.log
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mn-prime-recovery-acceptance
          path: z341-evidence/
          retention-days: 90
