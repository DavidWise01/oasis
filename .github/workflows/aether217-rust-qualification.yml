name: AETHER-217/233 Rust Executable Qualification
on:
  push:
    paths:
      - 'aether/rust/**'
      - 'aether/217/**'
      - 'aether/218/**'
      - 'aether/219/**'
      - 'aether/220/**'
      - 'aether/221/**'
      - 'aether/222/**'
      - 'aether/223/**'
      - 'aether/224/**'
      - 'aether/225/**'
      - 'aether/226/**'
      - 'aether/227/**'
      - 'aether/228/**'
      - 'aether/229/**'
      - 'aether/230/**'
      - 'aether/231/**'
      - 'aether/232/**'
      - 'aether/233/**'
      - '.github/workflows/aether217-rust-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rust-qualification:
    name: Native Rust qualification with captured failure diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: aether/rust
    steps:
      - name: Fetch exact repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Record compiler and source revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-artifacts
          rustc --version | tee qualification-artifacts/rustc-version.txt
          cargo --version | tee qualification-artifacts/cargo-version.txt
          git rev-parse HEAD | tee qualification-artifacts/commit.txt
      - name: Exercise Python diagnostic gate tests (NOT Cargo tests)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../218 -p 'test_qualification_gate.py' -v
          python3 ../218/qualification_gate.py --self-test
      - name: Exercise AETHER-219 manifest logic tests (NOT Cargo tests)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../219 -p 'test_evidence_manifest.py' -v
      - name: Exercise AETHER-220 browser/native parity logic (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../220 -p 'test_parity_gate.py' -v
          mkdir -p qualification-artifacts
          python3 ../220/parity_gate.py --reference ../220/reference.json --native ../220/synthetic-hold.json --browser ../220/synthetic-hold.json --out qualification-artifacts/aether220-synthetic-parity.json
      - name: Test synthetic custodian ancestry gate (NOT independent custody)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../221 -p 'test_custodian_enrollment.py' -v
      - name: Execute synthetic original-evidence and nonce replay regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../222 -p 'test_original_evidence.py' -v
      - name: Test integrated AETHER-223 adversarial review (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../223 -p 'test_adversarial_review.py' -v
      - name: Verify Phase XVIII frozen documentary decision (Python, not Rust)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../224 -p 'test_phase_xviii_freeze.py' -v
          mkdir -p qualification-artifacts
          python3 ../224/phase_xviii_freeze.py --out qualification-artifacts/aether224-freeze-assessment.json
      - name: Test synthetic GitHub run and artifact reconciliation (not live CI attestation)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../225 -p 'test_ci_reconciliation.py' -v
      - name: Validate AETHER-226 GitHub API metadata mock regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../226 -p 'test_actions_provenance.py' -v
      - name: Run native Cargo gate and capture failures
        shell: bash
        run: |
          set -euo pipefail
          python3 ../218/qualification_gate.py
      - name: Build exact-content evidence manifest, even after Cargo failure
        if: always()
        shell: bash
        run: |
          set +e
          python3 ../219/evidence_manifest.py --out qualification-artifacts/aether219-manifest.json
          result=$?
          echo "Manifest completeness and native qualification status: exit $result"
          exit 0
      - name: Probe actual GitHub Actions run metadata (noncertifying while active)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifacts
          python3 ../226/actions_provenance.py --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA" --out qualification-artifacts/aether226-api-readback.json || true
          echo "Run may still be active; an API readback is NOT proof of completed CI."
      - name: Test deterministic ZIP archive safety and source bindings (synthetic)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../227 -p 'test_archive_evidence.py' -v
      - name: Export local deterministic evidence ZIP and verify hashes
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-artifacts
          python3 ../227/archive_evidence.py \
            --directory qualification-artifacts \
            --source-sha "$GITHUB_SHA" \
            --export qualification-artifacts/aether227-local-export.zip \
            --out qualification-artifacts/aether227-local-inventory.json || true
          echo "Local export ZIP is not the GitHub-hosted artifact ZIP."
      - name: Test AETHER-228 hosted/browser byte parity (synthetic only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../228 -p 'test_hosted_browser_parity.py' -v
      - name: Record unavailable hosted artifact evidence without promotion
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-artifacts
          python3 ../228/hosted_browser_parity.py \
            --reference ../228/unverified-reference.json \
            --out qualification-artifacts/aether228-hosted-parity.json || true
          echo "A workflow cannot establish independent GitHub-hosted archive retention before external download."
      - name: Run three-root control ancestry regressions (synthetic only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../229 -p 'test_ancestry_gate.py' -v
      - name: Record missing external witnesses as fail-closed evidence
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-artifacts
          python3 ../229/ancestry_gate.py --evidence ../229/unverified-witnesses.json --out qualification-artifacts/aether229-ancestry.json || true
          echo "No independently authenticated external source roots acquired."
      - name: Run external challenge/replay synthetic regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../230 -p 'test_challenge_replay.py' -v
      - name: Record missing external receipt and nonce-ledger evidence
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-artifacts
          python3 ../230/challenge_replay.py --challenge ../230/unverified-challenge.json --out qualification-artifacts/aether230-challenge.json || true
          echo "No real remote challenge receipt, cryptographic signature or authenticated consumption ledger observed."
      - name: Run integrated cross-evidence adversarial tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../231 -p 'test_integrated_review.py' -v
      - name: Record fail-closed integrated evidence review
        if: always()
        shell: bash
        run: |
          mkdir -p qualification-artifacts
          python3 ../231/integrated_review.py --bundle ../231/unverified-review.json --out qualification-artifacts/aether231-review.json || true
          echo "No independent execution, remote custody or physical ACT qualified."
      - name: Evaluate frozen Phase XIX documentary record (not CI certification)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../232 -p 'test_phase_xix_freeze.py' -v
          mkdir -p qualification-artifacts
          python3 ../232/phase_xix_freeze.py --out qualification-artifacts/aether232-freeze.json
      - name: Test AETHER-233 live evidence acquisition decision logic (mocked transport)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ../233 -p 'test_acquire_execution.py' -v
      - name: Attempt own-run API acquisition before upload (must remain unqualified)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification-artifacts
          python3 ../233/acquire_execution.py --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA" --out qualification-artifacts/aether233-preupload-readback.json || true
          echo "Own run is unfinished and hosted artifact may not yet exist. No CI PASS is inferred."
      - name: Upload compiler logs and qualification evidence on pass OR failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether218-rust-qualification
          path: aether/rust/qualification-artifacts/
          if-no-files-found: warn
          retention-days: 30
