name: ROOT0 witness regression
on:
  push:
    paths:
      - 'docs/reality-tensor/dyson-inversions/p443_atomic.mjs'
      - 'docs/reality-tensor/dyson-inversions/p445_service.mjs'
      - 'docs/reality-tensor/dyson-inversions/p445_client.mjs'
      - 'docs/reality-tensor/dyson-inversions/test_p445.mjs'
      - 'docs/reality-tensor/dyson-inversions/p446_socket.mjs'
      - 'docs/reality-tensor/dyson-inversions/test_p446.mjs'
      - '.github/workflows/root0-witness-regression.yml'
  workflow_dispatch:
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System support
        run: |
          node -v
          command -v setpriv
          id
      - name: Socket recovery test
        run: node docs/reality-tensor/dyson-inversions/test_p446.mjs
      - name: Cross-user test
        run: sudo node docs/reality-tensor/dyson-inversions/test_p445.mjs
