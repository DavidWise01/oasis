name: AETHER-255 pidfd Attestation Regressions
on:
  push:
    paths:
      - 'aether/255/**'
      - '.github/workflows/aether255-attested-exit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-signature-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/255 -p 'test_*.py' -v
      - run: echo 'Ephemeral test keys do not qualify external custody or process exit authority.'
