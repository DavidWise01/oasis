name: AETHER-263 Readback and Rollback Regression
on:
  push:
    paths:
      - 'aether/263/**'
      - '.github/workflows/aether263-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/263 -p 'test_*.py' -v
      - run: echo 'Signed claims are not authenticated independent custody.'
