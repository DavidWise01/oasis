name: AETHER-267 Challenge Provenance Regressions
on:
  push:
    paths:
      - 'aether/267/**'
      - '.github/workflows/aether267-challenge-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ed25519-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/267 -p 'test_*.py' -v
      - run: echo 'Key custody and provenance are unverified even if signatures pass.'
