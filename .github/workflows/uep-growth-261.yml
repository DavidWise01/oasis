name: UEP-261R economic growth instrumentation
on:
  push:
    paths:
      - '.github/workflows/uep-growth-261.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71f980c1a596ad2942edba36cab6813e1cf6c569
          persist-credentials: false
      - name: Recover native-qualified dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uep261"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15077861777/zip" > "$RUNNER_TEMP/native.zip"
          echo "b0b1a676ef7ee44e33c4907dc08a926227edc4851f4495c2a406686475f0313e  $RUNNER_TEMP/native.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/native.zip" Cargo.lock > apps/uep/rust/Cargo.lock
          echo "af9e971445417daa5d9996aac6e35dafc51b8f93313076f7a70af2c59e5109f5  apps/uep/rust/Cargo.lock" | sha256sum -c -
          git rev-parse HEAD | tee "$RUNNER_TEMP/uep261/source.txt"
      - name: Execute inherited and new native regressions
        working-directory: apps/uep/rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 fetch --locked
          cargo +1.85.1 test --frozen 2>&1 | tee "$RUNNER_TEMP/uep261/tests.txt"
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'uep261'
          s=(p/'tests.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out',s)
          assert [sum(int(r[i]) for r in rows) for i in range(5)]==[176,0,0,0,0], rows
          assert len(re.findall(r'^test multi_archive::tests::.* \.\.\. ok$',s,re.M))==5
          PY
      - name: Profile isolated economic growth branches
        working-directory: apps/uep/rust
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/uep261"
          (cd ../UEP-259R-integrated-generations && sha256sum -c SHA256SUMS)
          cargo +1.85.1 run --frozen --release --bin growth261 -- "$out" | tee "$out/growth261.json"
          python3 - <<'PY' | tee "$out/summary261.json"
          import csv,json,os,pathlib,statistics
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'uep261'
          rows=list(csv.DictReader((p/'growth261.csv').open()))
          assert len(rows)==1080
          out={}
          for name in ['balanced','persistent_shortage','identity_churn']:
              a=[r for r in rows if r['scenario']==name]
              assert [int(r['period']) for r in a]==list(range(1081,1441))
              assert all(int(r['active'])==6 and int(r['observations'])<=360 for r in a)
              out[name]={'finalKnown':int(a[-1]['known']),'finalLots':int(a[-1]['lots']),'finalArrears':int(a[-1]['arrears']),'finalCanonicalBytes':int(a[-1]['canonical_bytes']),'peakCanonicalBytes':max(int(r['canonical_bytes']) for r in a),'medianAdvanceNs':statistics.median(int(r['advance_ns']) for r in a),'medianEncodeNs':statistics.median(int(r['encode_ns']) for r in a)}
          print(json.dumps(out,sort_keys=True))
          PY
          (cd "$out" && sha256sum growth261.csv growth261.json summary261.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uep-261r-native-evidence
          path: ${{ runner.temp }}/uep261/
      - name: Report qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="UEP-261R/native" -f description="Economic growth instrumentation" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
