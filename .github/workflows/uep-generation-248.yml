name: UEP-248R generational simulation
on:
  push:
    paths:
      - '.github/workflows/uep-generation-248.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e844e72e8799e656b860c65a322d2a26c4e73b3
          persist-credentials: false
      - name: Recover native-qualified dependency lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uep248"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15077861777/zip" > "$RUNNER_TEMP/native.zip"
          echo "b0b1a676ef7ee44e33c4907dc08a926227edc4851f4495c2a406686475f0313e  $RUNNER_TEMP/native.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/native.zip" Cargo.lock > apps/uep/rust/Cargo.lock
          echo "af9e971445417daa5d9996aac6e35dafc51b8f93313076f7a70af2c59e5109f5  apps/uep/rust/Cargo.lock" | sha256sum -c -
          git rev-parse HEAD | tee "$RUNNER_TEMP/uep248/source.txt"
      - name: Execute inherited and new native regressions
        working-directory: apps/uep/rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          cargo +1.85.1 fetch --locked
          cargo +1.85.1 test --frozen 2>&1 | tee "$RUNNER_TEMP/uep248/tests.txt"
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'uep248'
          s=(p/'tests.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out',s)
          assert [sum(int(r[i]) for r in rows) for i in range(5)]==[141,0,0,0,0], rows
          assert len(re.findall(r'^test integrated_abi::observation_tests::.* \.\.\. ok$',s,re.M))==3
          PY
      - name: Execute full generational archive and recovery
        working-directory: apps/uep/rust
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 run --release --frozen --bin generation248 -- "$RUNNER_TEMP/uep248" | tee "$RUNNER_TEMP/uep248/generation.txt"
          sha256sum "$RUNNER_TEMP/uep248"/generation.* | tee "$RUNNER_TEMP/uep248/generation.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uep-248r-native-evidence
          path: ${{ runner.temp }}/uep248/
      - name: Report qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="UEP-248R/native" -f description="Generational simulation" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
