      - '.github/workflows/n184-arc-bubble-v79.yml'
  workflow_dispatch:
jobs:
  dimensional-subdivision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
