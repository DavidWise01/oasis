name: AETHER-287 Manifest Export and Custody Claim Audit
on:
  push:
    paths:
      - 'aether/286/**'
      - 'aether/287/**'
      - '.github/workflows/aether287-export-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-artifact-and-signature-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'cryptography>=43,<47'
      - run: python3 -m unittest discover -s aether/287 -p 'test_*.py' -v
      - run: echo 'Export and self-supplied signed acknowledgments do not prove external custody.'
