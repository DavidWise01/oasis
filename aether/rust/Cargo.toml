[package]
name = "aether-evidence"
version = "0.1.0"
edition = "2021"
description = "Fail-closed AETHER evidence verification; synthetic fixtures are not physical evidence"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
# Tests use deterministic P-256 keys; no platform randomness is required.
