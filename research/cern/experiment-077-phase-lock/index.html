             ||[;]||</pre></section><script>let running=true,tick=0,T=2*Math.PI,ph=[0,T/3+.19,2*T/3-.13];let cv=document.getElementById('v'),c=cv.getContext('2d'),$=id=>document.getElementById(id);function draw(){c.clearRect(0,0,760,530);let x=380,y=257,r=177;c.strokeStyle='#46627e';for(let R of [r,110]){c.beginPath();c.arc(x,y,R,0,T);c.stroke()}for(let j=0;j<16;j++){let a=j*T/16;c.fillStyle=j===tick%16?'#9ceecf':'#3e557c';c.fillRect(x+110*Math.cos(a)-3,y+110*Math.sin(a)-3,6,6)}for(let i=0;i<3;i++){let a=ph[i]-Math.PI/2,xx=x+r*Math.cos(a),yy=y+r*Math.sin(a);c.strokeStyle=['#f17e96','#74e5c8','#809ff5'][i];c.beginPath();c.moveTo(x,y);c.lineTo(xx,yy);c.stroke();c.fillStyle=c.strokeStyle;c.beginPath();c.arc(xx,yy,22,0,T);c.fill();c.fillStyle='#07101e';c.font='bold 14px monospace';c.textAlign='center';c.fillText('Sp'+i,xx,yy+4)}c.fillStyle='#daecff';c.font='bold 16px monospace';c.textAlign='center';c.fillText('(((000)))',x,y);c.fillText('1×4×4×1',x,y+25);let z=ph.map((a,i)=>a-i*T/3),R=Math.hypot(z.reduce((s,a)=>s+Math.cos(a),0)/3,z.reduce((s,a)=>s+Math.sin(a),0)/3);$('readout').textContent='unit '+tick%60+' / 60 · cell '+tick%16+' · coherence '+R.toFixed(5)}function step(){let k=+$('k').value/100,b=+$('b').value/100,d=+$('d').value/100;let change=ph.map((a,i)=>1+(i-1)*d+k*ph.reduce((s,other,j)=>s+Math.sin(other-a-(j-i)*T/3),0)/3-b*.15);ph=ph.map((a,i)=>a+.04*change[i]);tick++;draw()}setInterval(()=>{if(running)step()},40);draw()</script></html>
