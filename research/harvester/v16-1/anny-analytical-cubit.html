<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anny | Analytical Cubit</title><style>
body{background:#0c1120;color:#eef4ff;font:16px system-ui;margin:3rem auto;max-width:1000px;padding:0 1rem}h1{margin-bottom:0}p{color:#adbad6}.bands{display:flex;flex-wrap:wrap;gap:12px;margin:2rem 0}.band{--c:#aaa;background:#1a2337;border:1px solid #566780;border-radius:14px;color:inherit;padding:16px;min-width:110px;flex:1;cursor:pointer;text-align:left}.band:focus-visible,.band.active{outline:3px solid var(--c)}.slots{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.slot{background:var(--c);color:#101222;border-radius:7px;padding:9px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b2740;padding:14px;border-radius:10px}#details{min-height:2em;padding:14px;border:1px solid #566780;border-radius:10px}small{color:#a7b8d6}
</style><h1>Anny · Analytical Cubit</h1><p>Seven ordered braces, 18 indexed positions. Color bands are symbolic; transport logic remains unchanged.</p><pre id="literal">{|12|}{|3456|}{|78|}{|910|}{|1112131415||}{|1617|}{|18|}</pre><main class="bands" id="bands"></main><section id="details" role="status" aria-live="polite">Select a band.</section><p><small>Band 5 preserves the distinct double-bar ending <code>||}</code>. No byte repair from the 12-bit projection.</small></p><script>
const parts=[[[1,2],'Red','#ff6972','{|12|}'],[[3,4,5,6],'Orange','#ffaa63','{|3456|}'],[[7,8],'Yellow','#f5dc73','{|78|}'],[[9,10],'Green','#86dbab','{|910|}'],[[11,12,13,14,15],'Blue','#80b9ff','{|1112131415||}'],[[16,17],'Indigo','#b6a1ff','{|1617|}'],[[18],'Violet','#d6a3ff','{|18|}']];
if(parts.length!==7||new Set(parts.flatMap(x=>x[0])).size!==18||parts.map(x=>x[3]).join('')!==document.getElementById('literal').textContent)throw Error('CUBIT_INVALID');
const host=document.getElementById('bands'),info=document.getElementById('details');
parts.forEach(([indices,name,color,literal],i)=>{const b=document.createElement('button');b.className='band';b.style.setProperty('--c',color);b.setAttribute('aria-label',name+' positions '+indices.join(','));const t=document.createElement('strong');t.textContent=(i+1)+' · '+name;const slots=document.createElement('div');slots.className='slots';indices.forEach(n=>{const s=document.createElement('span');s.className='slot';s.textContent=n;slots.append(s)});const code=document.createElement('small');code.textContent=literal;b.append(t,slots,code);b.onclick=()=>{document.querySelectorAll('.band').forEach(x=>x.classList.remove('active'));b.classList.add('active');info.textContent=name+': slots '+indices.join(', ')+'; exact brace '+literal+(i===4?' (double closure)':'')};host.append(b)});
</script></html>
