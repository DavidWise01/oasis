---
- name: Deploy KET Energy Titan offline six-channel viewer
  hosts: et_servers
  become: true
  gather_facts: true
  vars:
    et_port: 8086
    et_bind_address: '127.0.0.1'
    et_document_root: /var/www/ket-energy-titan
  tasks:
    - name: Validate Debian target and unprivileged port
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - et_port | int >= 1024
          - et_port | int <= 65535
          - et_bind_address in ['127.0.0.1', '0.0.0.0']
        fail_msg: 'Choose Debian/Ubuntu, a valid unprivileged port, and a supported bind address.'

    - name: Install nginx static web server
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: false

    - name: Create application document root
      ansible.builtin.file:
        path: '{{ et_document_root }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy standalone HTML with embedded WebAssembly
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../index.html'
        dest: '{{ et_document_root }}/index.html'
        owner: root
        group: root
        mode: '0644'

    - name: Install nginx configuration
      ansible.builtin.template:
        src: templates/et-nginx.conf.j2
        dest: /etc/nginx/sites-available/ket-energy-titan.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload KET nginx

    - name: Enable Energy Titan site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/ket-energy-titan.conf
        dest: /etc/nginx/sites-enabled/ket-energy-titan.conf
        state: link
      notify: Reload KET nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Activate deployed site
      ansible.builtin.meta: flush_handlers

    - name: Check local HTTP app response
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ et_port }}/
        method: GET
        return_content: true
        status_code: 200
        timeout: 12
      register: et_http_response
      changed_when: false

    - name: Verify deployed file has six-channel schema and embedded WASM
      ansible.builtin.assert:
        that:
          - "'KET/ET/SAPIEN/6CHANNEL/3DWASM/v06' in et_http_response.content"
          - "'__WASM_BASE64__' not in et_http_response.content"
        success_msg: 'Energy Titan 6-channel HTML + embedded WASM served.'

  handlers:
    - name: Reload KET nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
