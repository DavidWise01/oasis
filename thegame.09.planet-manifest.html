<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheGame · Planet Manifest 09</title><style>body{margin:0;background:#080d18;color:#eaf2ff;font:16px system-ui}main{max-width:900px;margin:auto;padding:30px 18px}p{color:#9aa9c1;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{min-height:86px;padding:11px;background:#111a2d;border:1px solid #2d4166;border-radius:12px}.a{border-color:#8ed1ff}.b{border-color:#64e68b}.c{border-color:#ff6e75}.letter{font-size:1.25rem;font-weight:700}small{color:#9aa9c1}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style><main><h1>TheGame · Planet Manifest 09</h1><p>Rail-world placeholders. Only the three explicitly named assignments are fixed here; the remaining letter worlds stay unassigned until named.</p><div class="grid" id="g"></div><p><a href="./thegame.08.charter.html">Charter 08</a> · <a href="./thegame.07.system-index.html">System index</a></p><script>const known={A:["Argon","cool"],B:["Boron","green"],C:["Carbon","red"]};const g=document.getElementById("g");[..."ABCDEFGHIJKLMNOPQRSTUVWXY"].forEach(x=>{let d=document.createElement("div"),v=known[x];d.className="card "+x.toLowerCase();d.innerHTML='<div class="letter">'+x+'</div><b>'+(v?v[0]:"Unassigned")+'</b><br><small>'+(v?v[1]:"open world")+'</small>';g.append(d)})</script></main></html>
